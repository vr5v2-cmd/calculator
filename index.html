<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Currency Converter</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .box { background: #1e293b; padding: 30px; border-radius: 20px; display: inline-block; max-width: 450px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        input, select { padding: 12px; border-radius: 10px; border: none; margin: 8px 0; width: 90%; background: #334155; color: white; }
        button { padding: 15px; border-radius: 10px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; width: 95%; margin-top: 10px; }
        #history { margin-top: 20px; text-align: left; font-size: 0.9em; color: #94a3b8; }
    </style>
</head>
<body>

<div class="box">
    <h1> Global Converter</h1>
    <input type="number" id="amount" placeholder="Сума">
    
    <select id="fromCurrency"></select>
    <select id="toCurrency"></select>
    
    <button onclick="convert()">Конвертувати</button>
    <h2 id="result">0.00</h2>

    <div id="history">
        <h4>Останні розрахунки:</h4>
        <ul id="historyList"></ul>
    </div>
</div>

<script>
    const apiKey = "https://api.exchangerate-api.com/v4/latest/USD"; // Безкоштовне API
    let rates = {};

    async function loadCurrencies() {
        const res = await fetch(apiKey);
        const data = await res.json();
        rates = data.rates;
        const currencies = Object.keys(rates);
        
        currencies.forEach(cur => {
            document.getElementById('fromCurrency').innerHTML += `<option value="${cur}">${cur}</option>`;
            document.getElementById('toCurrency').innerHTML += `<option value="${cur}">${cur}</option>`;
        });
    }

    function convert() {
        const amount = document.getElementById('amount').value;
        const from = document.getElementById('fromCurrency').value;
        const to = document.getElementById('toCurrency').value;
        
        const result = (amount / rates[from]) * rates[to];
        document.getElementById('result').innerText = result.toFixed(2) + " " + to;

        // Додаємо в історію
        const li = document.createElement('li');
        li.innerText = `${amount} ${from} = ${result.toFixed(2)} ${to}`;
        document.getElementById('historyList').prepend(li);
    }

    loadCurrencies();
</script>
</body>
</html>
