<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"><meta name="google-site-verification" content="qdiuIW42XuJ8OZgv7sN-sHPwIYN4zppBNZPxWaRq-WE" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій Онлайн Конвертер</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { padding: 10px; border-radius: 8px; border: none; margin: 10px; width: 150px; text-align: center; font-size: 16px; background: #333; color: white; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: #007aff; color: white; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        h2 { color: #34c759; }
    </style>
</head>
<body>

    <div class="box"><footer>
    <p>Це простий конвертер валют для швидкого перерахунку UAH в USD. 
    Використовуйте цей інструмент, щоб миттєво дізнатися суму в доларах.</p>
</footer>

        <h1>💸 Швидкий Конвертер (UAH ➡️ USD)</h1>
        <p>Введіть суму в гривнях:</p>
        <input type="number" id="uanInput" placeholder="Наприклад: 1000">
        <br>
        <button onclick="convert()">Конвертувати</button>
        <h2 id="result">$0.00</h2>
    </div>

   <script>
    let currentRate = 41.5; // Базовий курс

    // Функція для отримання актуального курсу
    async function fetchRate() {
        try {
            const response = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=USD&json');
            const data = await response.json();
            currentRate = data[0].rate;
            document.getElementById('rateDisplay').innerText = "Курс НБУ: " + currentRate.toFixed(2) + " грн";
        } catch (error) {
            console.log("Курс завантажено з помилкою, використовуємо стандартний");
        }
    }
    fetchRate();

    function convert() {
        let uah = document.getElementById('uanInput').value;
        let usd = (uah / currentRate).toFixed(2);
        document.getElementById('result').innerText = "$" + usd;
    }
</script>
